<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信完了｜メドワーク産業医事務所</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    font-size: 17px;
    line-height: 1.85;
    color: #2c2c2c;
    background: #fff;
  }
  :root {
    --navy: #1a3557;
    --teal: #2a7a8c;
    --accent: #c0392b;
    --gray-bg: #f7f8fa;
  }
  a { color: inherit; text-decoration: none; }

  /* ===== HEADER ===== */
  header {
    background: var(--navy);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo { color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: 0.04em; }
  .logo span { display: block; font-size: 0.7rem; font-weight: 400; opacity: 0.8; margin-top: 2px; }

  /* ===== MAIN ===== */
  .thanks-wrap {
    max-width: 680px;
    margin: 80px auto 100px;
    padding: 0 24px;
    text-align: center;
  }
  .thanks-icon {
    width: 64px;
    height: 64px;
    background: var(--teal);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
  }
  .thanks-icon svg {
    width: 32px;
    height: 32px;
    stroke: #fff;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .thanks-wrap h1 {
    font-size: 1.5rem;
    color: var(--navy);
    margin-bottom: 20px;
    font-weight: 700;
  }
  .thanks-wrap p {
    color: #444;
    font-size: 1rem;
    line-height: 1.9;
    margin-bottom: 12px;
  }
  .thanks-wrap p.note {
    font-size: 0.9rem;
    color: #777;
    margin-top: 8px;
  }
  .btn-home {
    display: inline-block;
    margin-top: 40px;
    padding: 14px 36px;
    background: var(--navy);
    color: #fff;
    border-radius: 4px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: background 0.2s;
  }
  .btn-home:hover { background: var(--teal); }

  /* ===== FOOTER ===== */
  footer {
    background: var(--navy);
    color: rgba(255,255,255,0.7);
    text-align: center;
    padding: 28px 24px;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    メドワーク産業医事務所
    <span>MEDWORK Occupational Health Office</span>
  </div>
</header>

<main>
  <div class="thanks-wrap">
    <div class="thanks-icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>お問い合わせありがとうございます</h1>
    <p>内容を確認のうえ、<strong>2営業日以内</strong>にご連絡いたします。</p>
    <p>しばらくお待ちください。</p>
    <p class="note">※ 返信メールが届かない場合は、迷惑メールフォルダをご確認ください。</p>
    <a href="/" class="btn-home">トップページへ戻る</a>
  </div>
</main>

<footer>
  <p>&copy; 2025 メドワーク産業医事務所</p>
</footer>

</body>
</html>
